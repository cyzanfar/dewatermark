name: Dewatermark Scan
description: Detect suspicious Unicode artifacts and emit GitHub-compatible SARIF.
author: Cyrus Anfar
branding:
  icon: search
  color: purple
inputs:
  paths:
    description: Newline-delimited paths to scan (one literal path per line)
    default: .
  output:
    description: SARIF output path
    default: dewatermark.sarif
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Install dewatermark action
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Scan repository
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        paths=()
        while IFS= read -r path; do
          if [[ -n "$path" ]]; then
            paths+=("$path")
          fi
        done <<< "$INPUT_PATHS"
        if [[ ${#paths[@]} -eq 0 ]]; then
          echo "At least one scan path is required" >&2
          exit 2
        fi
        status=0
        dewatermark check --format sarif --output "$INPUT_OUTPUT" -- "${paths[@]}" || status=$?
        if [[ $status -ne 0 && $status -ne 1 ]]; then
          exit "$status"
        fi
