name: Dewatermark Scan
description: Detect hidden Unicode text watermarks and emit GitHub-compatible SARIF.
author: Cyrus Anfar
branding:
  icon: search
  color: purple
inputs:
  paths:
    description: Space-separated paths to scan
    default: .
  output:
    description: SARIF output path
    default: dewatermark.sarif
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install dewatermark action
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Scan repository
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_OUTPUT: ${{ inputs.output }}
      run: dewatermark check $INPUT_PATHS --format sarif --output "$INPUT_OUTPUT" || test $? -eq 1
