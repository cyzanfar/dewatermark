name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(python -c 'exec(open("src/dewatermark/_version.py").read()); print(__version__)')"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build pytest twine
          python -m build
          python -m twine check dist/*
      - name: Validate distribution contents
        env:
          DEWATERMARK_DIST_DIR: dist
        run: python -m pytest tests/test_distribution_artifacts.py
      - name: Smoke-test installed wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          python -I -c "import dewatermark, dewatermark_eval; from importlib.resources import files; assert files('dewatermark').joinpath('skills/remove-text-watermarks/SKILL.md').is_file()"
          dewatermark capabilities
      - name: Prepare SBOM output
        run: mkdir -p attestations
      - name: Generate distribution SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: attestations/dewatermark.spdx.json
          upload-artifact: false
      - name: Attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/*
      - name: Attest SBOM
        uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
        with:
          subject-path: dist/*
          sbom-path: attestations/dewatermark.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sbom
          path: attestations/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dewatermark
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist/
      - name: Verify GitHub build attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify dist/*.whl --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/*.tar.gz --repo "$GITHUB_REPOSITORY"
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
