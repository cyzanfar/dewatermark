name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-publishing
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release identity
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release tag targets a commit on main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify every release surface has the tag version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          namespace = {}
          exec(Path("src/dewatermark/_version.py").read_text(encoding="utf-8"), namespace)
          version = namespace["__version__"]
          assert re.fullmatch(
              r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version
          ), "stable publishing refuses prerelease or non-SemVer versions"
          assert os.environ["RELEASE_TAG"] == f"v{version}"
          assert json.loads(Path("web/package.json").read_text(encoding="utf-8"))["version"] == version
          citation = Path("CITATION.cff").read_text(encoding="utf-8")
          assert re.search(rf"^version: {re.escape(version)}$", citation, re.MULTILINE)
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          assert re.search(
              rf"^## \[{re.escape(version)}\] - [0-9]{{4}}-[0-9]{{2}}-[0-9]{{2}}$",
              changelog,
              re.MULTILINE,
          ), "stable publishing requires a dated changelog release heading"
          PY

  container:
    name: Publish signed container
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push the release image to GHCR.
      id-token: write # Required to create artifact attestations.
      attestations: write # Required to store provenance and SBOM attestations.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build local smoke-test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: dewatermark:release-smoke
      - name: Test authenticated health endpoint and non-root runtime
        shell: bash
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' dewatermark:release-smoke)" = dewatermark
          container_id=$(docker run --rm -d \
            -e DEWATERMARK_SERVER_API_KEY=release-smoke-secret \
            -p 127.0.0.1:8765:8765 \
            dewatermark:release-smoke serve --host 0.0.0.0 --port 8765)
          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent \
              -H 'Authorization: Bearer release-smoke-secret' \
              http://127.0.0.1:8765/health > health.json; then
              break
            fi
            sleep 1
          done
          python -c 'import json; assert json.load(open("health.json")) == {"status": "ok"}'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8765/health)" = 401
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha
      - id: push
        name: Build and publish multi-platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Attest container provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Generate container SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: container.spdx.json
          upload-artifact: false
      - name: Attest container SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: container.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-sbom
          path: container.spdx.json
          if-no-files-found: error
          retention-days: 90

  build:
    name: Build release distributions
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and validate distributions
        run: |
          python -m pip install build==1.5.0 pytest==9.1.1 twine==7.0.0
          python -m build
          python -m twine check dist/*
          mkdir dist-from-sdist
          python -m pip wheel --no-deps --wheel-dir dist-from-sdist dist/*.tar.gz
      - name: Validate distribution contents
        env:
          DEWATERMARK_DIST_DIR: dist
        run: python -m pytest tests/test_distribution_artifacts.py
      - name: Smoke-test installed wheel
        run: |
          python -m pip install --force-reinstall dist-from-sdist/*.whl
          python -m pip check
          python -I -c "import dewatermark, dewatermark_eval; from importlib.resources import files; assert files('dewatermark').joinpath('skills/remove-text-watermarks/SKILL.md').is_file()"
          dewatermark capabilities
          dewatermark-evidence --help
      - name: Prepare SBOM output
        run: mkdir -p attestations
      - name: Generate distribution SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: attestations/dewatermark.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sbom
          path: attestations/
          if-no-files-found: error
          retention-days: 90

  attest:
    name: Attest validated distributions
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required to download validated build artifacts.
      attestations: write # Required to store distribution attestations.
      contents: read
      id-token: write # Required to sign build provenance and the SBOM.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-sbom
          path: attestations/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Attest SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: dist/*
          sbom-path: attestations/dewatermark.spdx.json

  verify:
    name: Required release checks
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install -e ".[dev,agents]"
      - run: python -m pytest
      - run: ruff check src tests eval adapters scripts examples
      - run: ruff format --check src tests eval adapters scripts examples
      - run: mypy src/dewatermark
      - run: python scripts/export_openapi.py --check
      - run: dewatermark detectors doctor
      - run: dewatermark detectors conformance
      - name: Verify browser package
        working-directory: web
        run: npm run check

  publish:
    name: Publish distributions to PyPI
    needs: attest
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dewatermark
    permissions:
      actions: read # Required to download the attested distributions.
      attestations: read # Required to verify GitHub attestations before upload.
      contents: read
      id-token: write # Required for PyPI trusted publishing.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist/
      - name: Verify GitHub build attestation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh attestation verify dist/*.whl \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml" \
            --source-ref "refs/tags/$RELEASE_TAG"
          gh attestation verify dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml" \
            --source-ref "refs/tags/$RELEASE_TAG"
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
