name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: moderate

  pip-audit:
    name: Python dependency audit (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: base
            install: .
          - profile: agents
            install: ".[agents]"
          - profile: local
            install: ".[local]"
          - profile: eval
            install: ".[eval]"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - env:
          INSTALL_TARGET: ${{ matrix.install }}
        run: python -m pip install "$INSTALL_TARGET" pip-audit==2.10.1
      - run: python -m pip check
      - run: python -m pip uninstall --yes dewatermark
      - run: pip-audit --strict --desc on

  codeql:
    name: CodeQL (${{ matrix.language }})
    permissions:
      contents: read
      security-events: write # Required for CodeQL to upload analysis results.
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: none
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          category: "/language:${{ matrix.language }}"

  npm-audit:
    name: VS Code package dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install exactly the locked extension toolchain
        working-directory: integrations/vscode
        run: npm ci --ignore-scripts
      - name: Fail on audited dependency vulnerabilities
        working-directory: integrations/vscode
        run: npm audit --audit-level=high
