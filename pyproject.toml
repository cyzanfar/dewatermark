[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "dewatermark"
dynamic = ["version"]
description = "Verification-first AI text watermark remover for Unicode artifacts and detector-scoped statistical watermark mitigation."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "UNICODE_LICENSE.txt"]
authors = [{ name = "Cyrus Anfar" }]
keywords = ["text watermark remover", "AI watermark remover", "LLM watermark", "watermark detector", "statistical watermark", "steganography", "unicode", "SynthID", "AI agents"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "Topic :: Text Processing :: Filters",
]
dependencies = [
    "requests>=2.31",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
local = ["torch>=2.13.0", "transformers>=5.15.0"]
eval = [
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "sentence-transformers>=5.7.0",
    "bert-score>=0.3.13",
    "mauve-text>=0.4.0",
]
dev = [
    "pytest>=9.1.1", "pytest-cov>=7.1.0", "hypothesis>=6.165.9", "ruff>=0.16.3",
    "mypy>=2.3.1,<3", "types-requests>=2.33.0.20260712", "jsonschema>=4.26.0",
    "build>=1.5.0", "twine>=7.0.0",
]
agents = ["mcp>=2.0.0,<3; python_version >= '3.10'"]

[project.scripts]
dewatermark = "dewatermark.cli:main"
dewatermark-eval = "dewatermark_eval.run_eval:main"
dewatermark-evidence = "dewatermark_eval.evidence:main"
dewatermark-mcp = "dewatermark.mcp_server:main"

[tool.pytest.ini_options]
pythonpath = ["src", "eval"]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/cyzanfar/text-watermark-remover"
Repository = "https://github.com/cyzanfar/text-watermark-remover"
Issues = "https://github.com/cyzanfar/text-watermark-remover/issues"
Changelog = "https://github.com/cyzanfar/text-watermark-remover/blob/main/CHANGELOG.md"
Documentation = "https://cyzanfar.github.io/text-watermark-remover/"

[tool.hatch.build.targets.wheel]
packages = ["src/dewatermark"]
exclude = [
    "eval/.venv", "eval/**/__pycache__", "eval/RESULTS.md",
    "adapters/**/__pycache__", "adapters/**/*.pyc", "adapters/**/*.pyo",
]

[tool.hatch.build.targets.wheel.force-include]
"eval" = "dewatermark_eval"
"skills/remove-text-watermarks" = "dewatermark/skills/remove-text-watermarks"
"schemas" = "dewatermark/data/schemas"
"adapters" = "dewatermark/data/adapters"

[tool.hatch.build.targets.sdist]
include = [
    "src/dewatermark", "eval/*.py", "eval/*.json", "eval/protocols", "eval/README.md",
    "eval/PROTOCOL_RUN.md", "eval/requirements.txt",
    "README.md", "LICENSE", "UNICODE_LICENSE.txt", "CONTRIBUTING.md", "SECURITY.md", "CHANGELOG.md",
    "CODE_OF_CONDUCT.md", "AGENTS.md", "docs", "examples", "schemas", "skills", "tests",
    "adapters",
]

[tool.hatch.version]
path = "src/dewatermark/_version.py"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
files = ["src/dewatermark"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["dewatermark"]

[tool.coverage.report]
show_missing = true
fail_under = 65
